<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The window loads only its own files, reads videos only through media:// (electron/main.ts), and never reaches the
         web (src/shorts/face-finder.ts). 'wasm-unsafe-eval' runs the face detector's WebAssembly, which comes only from
         the app's own files. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src media:; media-src media:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="top-bar">
      <span class="app-title">
        <img id="app-icon" alt="" width="22" height="22" />
        <span id="app-name"></span>
      </span>
      <span class="top-actions" id="top-actions"></span>
    </header>
    <div id="notices"></div>
    <main id="screen"></main>
  </body>
</html>
