<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The window loads only its own files. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title></title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="top-bar">
      <span class="app-title">
        <img id="app-icon" alt="" width="22" height="22" />
        <span id="app-name"></span>
      </span>
    </header>
    <main id="screen"></main>
  </body>
</html>
