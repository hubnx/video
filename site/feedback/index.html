<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feedback · %APP_NAME%</title>
    <meta name="description" content="Tell us what went wrong or what would make %APP_NAME% better." />
    <link rel="canonical" href="%SITE_URL%/feedback/" />
    <!--robots-->
    <!--icons-->
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/page.ts"></script>
  </head>
  <body>
    <!--header-->
    <main>
      <article class="document">
        <h1>Feedback</h1>
        <p>Something went wrong, or something would make %APP_NAME% better? Tell us here. Leave your email if you'd like a reply.</p>
        <div data-feedback="form"></div>
        <p data-feedback="done" hidden>Thanks, it's sent. We read every message.</p>
      </article>
    </main>
    <!--footer-->
  </body>
</html>
