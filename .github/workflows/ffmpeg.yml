# Builds the FFmpeg the app carries for Linux and Windows (Windows cross-compiled with mingw-w64), from the pinned
# sources in ffmpeg/build.sh, on GitHub's Ubuntu. The Mac builds are made on the owner's Intel Mac, both kinds, for
# free. Each archive's SHA-256 is printed; the builds go up as the run's artifact, then onto the release named in
# ffmpeg/builds.json, whose pins are updated in the same commit. Started by hand only.
name: FFmpeg builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, win-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: The build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm autoconf automake libtool pkg-config mingw-w64

      - name: Build
        run: bash ffmpeg/build.sh ${{ matrix.target }} out

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/*.tar.xz
          retention-days: 7
